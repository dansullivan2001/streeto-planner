[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "streeto-planner"
version = "0.1.0"
description = "Plan a high-scoring Street-O route from a photo of the map."
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pillow>=10.1"]
streamlit = ["streamlit>=1.52", "streamlit-folium>=0.23", "folium>=0.17", "pillow>=10.1"]

[project.scripts]
streeto = "streeto_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
