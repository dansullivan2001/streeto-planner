[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "streeto-planner"
version = "0.1.0"
description = "Plan a high-scoring Street-O route from a photo of the map."
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
streeto = "streeto_planner.cli:main"
streeto-web = "streeto_planner.web:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
streeto_planner = ["static/*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
